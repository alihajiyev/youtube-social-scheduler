name: YouTube to Instagram & TikTok

on:
  schedule:
    # Her gun Azerbaycan saati 13:05 (UTC 09:05)
    - cron: '5 9 * * *'
    # Her gun Azerbaycan saati 20:05 (UTC 16:05)
    - cron: '5 16 * * *'
  workflow_dispatch:
    inputs:
      force_video_id:
        description: 'YouTube video ID to force post (leave empty for auto)'
        required: false
        default: ''

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Setup TikTok cookies
        run: |
          echo '${{ secrets.TIKTOK_COOKIES }}' > tiktok_cookies.json

      - name: Check and post new videos
        env:
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          FORCE_VIDEO_ID: ${{ github.event.inputs.force_video_id }}
        run: python main.py

      - name: Upload posted videos data
        uses: actions/upload-artifact@v4
        with:
          name: posted-videos
          path: posted_videos.json
          retention-days: 90
