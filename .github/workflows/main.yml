name: YouTube to Instagram

on:
  schedule:
    - cron: '5 9 * * *'
    - cron: '5 16 * * *'
  workflow_dispatch:
    inputs:
      force_video_id:
        description: 'YouTube video ID to force post'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check and post
        env:
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          FORCE_VIDEO_ID: ${{ github.event.inputs.force_video_id }}
        run: python main.py

      - name: Save posted videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_videos.json
          git diff --cached --quiet || git commit -m "Update posted_videos [skip ci]"
          git push || echo "Push failed, continuing..."
